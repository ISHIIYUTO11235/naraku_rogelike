<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="奈落潜り">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>奈落潜り</title>
<style>
:root{--bg:#07070c;--panel:rgba(14,14,24,.95);--line:#2c2c44;--fg:#e8e6f0;--dim:#9a97ad;--acc:#ffcf6b;--tc:#7fb8ff;--ec:#ffb36b;--sc:#8fe39a;--rc:#d7a6ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;overflow:hidden;user-select:none}
canvas{display:block;cursor:crosshair}
code{background:#1b1b2c;padding:1px 4px;border-radius:3px}
#hud{position:fixed;left:12px;top:10px;font-size:13px;pointer-events:none;text-shadow:0 1px 2px #000}
.bar{width:260px;height:15px;background:#2a1018;border:1px solid #000;position:relative;border-radius:3px;overflow:hidden}
.bar.sm{height:6px;margin-top:3px;background:#1a1a10;display:none}
#hpb{height:100%;background:linear-gradient(#ff5a6e,#c22740);width:100%}
#fuelb{height:100%;background:#ffb347;width:100%}
#shb{position:absolute;left:0;top:0;height:100%;background:rgba(120,200,255,.55)}
#hpt{position:absolute;inset:0;text-align:center;font-size:11px;line-height:15px;font-family:monospace}
#depth{font-size:24px;font-weight:700;margin-top:6px;font-family:monospace}
#layer{color:var(--acc);font-size:14px}
#frag,#pend{color:var(--dim);margin-top:2px}
#abil{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:none}
.ab{width:104px;height:48px;background:var(--panel);border:1px solid var(--line);border-radius:6px;position:relative;overflow:hidden;font-size:11px;padding:5px 7px}
.ab b{color:var(--acc);margin-right:5px}
.ab .cd{position:absolute;left:0;bottom:0;width:100%;height:0;background:rgba(0,0,0,.7)}
.ab .nm{position:relative;z-index:1;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log{position:fixed;left:12px;bottom:12px;font-size:12px;max-width:44vw;pointer-events:none;text-shadow:0 1px 2px #000}
#log div{margin-top:2px}
#help{position:fixed;right:12px;bottom:10px;font-size:11px;color:var(--dim);text-align:right;pointer-events:none;line-height:1.7;text-shadow:0 1px 2px #000}
#banner{position:fixed;left:50%;top:20%;transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity 1.2s;width:min(660px,90vw);text-shadow:0 2px 10px #000}
#banner .bl{font-size:13px;color:var(--dim);letter-spacing:.3em}
#banner .bn{font-size:34px;font-weight:700;color:var(--acc);margin:6px 0}
#banner .bd{font-size:14px;line-height:1.8}
.ov{position:fixed;inset:0;background:rgba(4,4,10,.85);display:none;align-items:center;justify-content:center;z-index:10}
.ov.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 24px;max-width:min(1120px,96vw);max-height:93vh;overflow:auto}
h1{margin:0 0 6px;font-size:36px;letter-spacing:.2em}
h2{margin:0}
.sub{color:var(--dim);margin-bottom:18px;line-height:1.7}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
.note{font-size:11px;color:var(--dim);line-height:1.7}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{background:#24243a;color:var(--fg);border:1px solid #44446a;border-radius:6px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}
button:hover{background:#30304c}
button.pri{background:#6a4a12;border-color:#b98a2c}
button.pri:hover{background:#7d5816}
button.sm{padding:2px 8px;font-size:11px}
button:disabled{opacity:.4;cursor:default}
input,select{background:#10101c;color:var(--fg);border:1px solid #44446a;border-radius:6px;padding:8px 10px;font:inherit;width:100%}
.invh{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.invh span{color:var(--dim);flex:1}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button.on{background:#3a3a60;border-color:#7a7ab0}
.inv{display:grid;grid-template-columns:250px 1fr 330px;gap:18px;width:min(1060px,92vw)}
.slot{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-bottom:6px;cursor:pointer;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot:hover{background:#1c1c30}
.slot small{color:var(--dim);margin-right:8px;display:inline-block;width:34px}
.list{max-height:64vh;overflow:auto;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:0 8px}
.it{padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.it:hover,.it.sel{background:#22223a}
.it.sel{outline:1px solid #6a6aa0}
.it .eqm{color:var(--dim);font-size:11px;white-space:nowrap}
.it .eqm.on{color:var(--acc)}
.it[data-pid]{border:1px solid #2c2c44;margin-bottom:4px}
.chip{display:inline-flex;align-items:center;gap:3px;border:1px solid;border-radius:12px;padding:1px 3px 1px 8px;margin:2px 1px;font-size:12px;line-height:1.5}
.chip.t{color:var(--tc);border-color:#35507a}.chip.e{color:var(--ec);border-color:#7a5530}
.chip button{padding:0 5px;font-size:10px;border-radius:10px;line-height:1.4}
.rbox{border:1px solid #3a2f55;border-radius:8px;padding:6px 8px;margin-bottom:6px;font-size:12px}
.rbox .arrow{color:var(--rc);margin:0 4px}
.grp{font-size:11px;color:var(--dim);letter-spacing:.2em;margin:10px 0 4px}
.det h3{margin:0 0 2px;font-size:18px}
.meta{font-size:11px;color:var(--dim)}
.det .fl{color:#c9c5da;font-size:12px;line-height:1.7;margin:8px 0 10px;font-style:italic}
.det .row{font-size:13px;line-height:1.8}
.det .tier{color:var(--dim);font-size:11px}
.rune{color:var(--rc)}
.sum{font-size:12px;color:var(--dim);line-height:1.8;margin-top:10px}
.box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:13px;line-height:1.8}
.ok{color:#8fe39a}.ng{color:#ff8a8a}
.inv2{grid-template-columns:auto 1fr 330px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,52px);gap:6px;align-content:start;max-height:56vh;overflow:auto;padding:2px}
.cell{width:52px;height:52px;border:2px solid #333;border-radius:7px;background:radial-gradient(circle at 50% 40%,#22223a,#121220);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.cell:hover{filter:brightness(1.25)}
.cell.sel,.eslot.sel{box-shadow:0 0 0 2px #fff}
.cell .b{position:absolute;font-size:10px;line-height:1;font-weight:700;text-shadow:0 1px 2px #000}
.cell .eq{top:3px;left:4px;color:var(--acc)}.cell .lv{top:3px;right:4px;color:#ddd}.cell .rn{bottom:3px;right:4px;color:var(--rc)}
.doll{display:flex;gap:8px}
.doll>div{display:flex;flex-direction:column;gap:8px}
.eslot{width:66px;height:66px;border:2px solid #2c2c44;border-radius:8px;background:#11111d;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.eslot .sl{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:10px;color:var(--dim)}
.filt{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.filt button{padding:3px 8px;display:flex;align-items:center;gap:3px;font-size:12px}
.filt button.on{background:#3a3a60;border-color:#7a7ab0}
.dh{display:flex;gap:10px;align-items:center}
.dh .ic{width:52px;height:52px;border:2px solid #333;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#121220;flex:none}
.anvwrap{width:min(760px,92vw)}
.anvil{display:flex;align-items:flex-start;gap:16px;justify-content:center;padding:22px 18px 14px;background:linear-gradient(#1b1b26,#121219);border:2px solid #3a3a52;border-radius:10px;box-shadow:inset 0 0 0 2px #0a0a10}
.acol{display:flex;flex-direction:column;align-items:center;gap:6px;width:150px}
.aslot{width:80px;height:80px;border:3px solid #4a4a60;background:#0d0d15;border-radius:6px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;box-shadow:inset 0 0 0 2px #000}
.aslot.empty{border-style:dashed;border-color:#34344a}
.aslot .b{position:absolute;top:4px;left:6px;font-size:11px;font-weight:700;color:var(--acc)}
.aslot.out{width:92px;height:92px}
.alab{font-size:12px;color:var(--dim);text-align:center;line-height:1.4}
.plus,.arr{font-size:30px;color:#666;margin-top:22px}.arr{color:#aaa}
.outrunes{margin:10px 0 0;text-align:center}
.chips{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px;margin:4px 0}
.abtns{display:flex;gap:10px;justify-content:center;margin:12px 0 6px}
.abtns button{font-size:14px;padding:8px 18px}
.cost{color:#9fd;margin-left:8px;font-weight:700}
.ahint{text-align:center;font-size:11px;color:var(--dim);margin-bottom:12px}
.agrid{max-height:34vh;justify-content:center}
.cell.used{opacity:.3}
#tip{position:fixed;z-index:40;pointer-events:none;background:rgba(16,6,28,.97);border:2px solid #4a2a7a;border-radius:6px;padding:10px 12px;max-width:360px;display:none;box-shadow:0 6px 24px #000a}
#tip .fl{margin:6px 0}
/* ---- スマホ操作 ---- */
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:5}
body.touch #touch{display:block}
body.touch #help,body.touch #abil{display:none}
body.touch #log{bottom:auto;top:118px;max-width:55vw;font-size:11px}
body.touch #hud{font-size:12px}
body.touch #depth{font-size:20px}
.card{touch-action:pan-y}
#stickZone{position:absolute;left:0;bottom:0;width:48vw;height:70vh;pointer-events:auto;touch-action:none}
#stickBase{position:absolute;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.22)}
#stickKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.45)}
#stickBase.dig #stickKnob{background:rgba(255,190,90,.45);border-color:#ffcf6b}
.tb{position:absolute;pointer-events:auto;touch-action:none;width:58px;height:58px;border-radius:50%;background:rgba(24,24,40,.6);border:2px solid rgba(255,255,255,.28);color:#fff;font-size:17px;font-weight:700;padding:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tb.on{background:rgba(255,207,107,.35);border-color:#ffcf6b}
.tb.big{width:76px;height:76px;font-size:20px}
.tb .cdv{position:absolute;left:0;bottom:0;width:100%;height:0;background:rgba(0,0,0,.65)}
.tb span{position:relative;z-index:1;font-size:11px;line-height:1.1;text-align:center}
.tb.sm{width:auto;height:34px;border-radius:17px;padding:0 12px;font-size:13px;position:static}
#ttop{position:absolute;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));display:flex;gap:6px;pointer-events:auto}
#tbRest{display:none}
@media (max-width:860px){.acol{width:96px}.aslot{width:62px;height:62px}.aslot.out{width:70px;height:70px}.anvil{gap:6px;padding:16px 6px 10px}.plus,.arr{font-size:22px;margin-top:16px}.abtns button{font-size:13px;padding:8px 12px}}
@media (max-width:860px){.inv{grid-template-columns:1fr}.list{border:none;padding:0}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="bar"><div id="hpb"></div><div id="shb"></div><div id="hpt"></div></div><div class="bar sm" id="fuelw"><div id="fuelb"></div></div><div id="depth">0 m</div><div id="layer"></div><div id="frag"></div><div id="pend"></div></div>
<div id="abil"></div>
<div id="log"></div>
<div id="help">A / D 移動 ・ Space 跳躍（長押しで滑空・噴射）<br>左クリック 掘る（岩がなければ攻撃）・ 右クリック 攻撃 ・ F / ホイール押し 鉤縄<br>1〜4 遺物の能力 ・ E キャンプで休息 ・ I 遺物と合成炉 ・ Esc 設定</div>
<div id="banner"><div class="bl" id="bl"></div><div class="bn" id="bn"></div><div class="bd" id="bd"></div></div>

<div class="ov on" id="title"><div class="card" style="width:560px">
  <h1>奈落潜り</h1>
  <div class="sub">底の見えない大縦穴を、遺物を纏って潜り続ける。<br>上へ戻ろうとする者には、代償が降りかかる。</div>
  <label for="vol">効果音の音量（M キーでミュート）</label>
  <input id="vol" type="range" min="0" max="100" step="1" style="padding:0">
  <div class="btns"><button class="pri" id="start">潜る</button><button id="newg">世界を作り直す</button><button id="fsBtn" style="display:none">全画面で遊ぶ</button></div>
  <p class="note" id="touchNote" style="display:none">スマホ：左側をなぞってスティック（倒した方向に歩き、その先のブロックを掘る）。右のボタンで 跳ぶ・攻撃（近くの敵を自動で狙う）・鉤縄・能力。横向きがおすすめ。ホーム画面に追加すると全画面で遊べる。</p>
</div></div>
<div id="tip"></div>
<div id="touch">
  <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
  <button class="tb big" id="tbJump">跳</button>
  <button class="tb big" id="tbAtk">攻</button>
  <button class="tb" id="tbHook">鉤</button>
  <div id="tbAbil"></div>
  <div id="ttop"><button class="tb sm" id="tbRest">休息</button><button class="tb sm" id="tbInv">遺物</button><button class="tb sm" id="tbMenu">≡</button></div>
</div>
<div class="ov" id="invOv"><div class="card" id="invCard"></div></div>
<div class="ov" id="deathOv"><div class="card" style="text-align:center;width:420px"><h2>力尽きた</h2><p id="deathMsg" class="sub" style="margin:12px 0"></p><button class="pri" id="revive">最後のキャンプから再開</button></div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const TS=16,W=140,CH=64,LAYER=250,TOP=12;
const cv=$('c'),ctx=cv.getContext('2d');
const lc=document.createElement('canvas'),lx=lc.getContext('2d');
let VW=0,VH=0;
function resize(){VW=cv.width=lc.width=innerWidth;VH=cv.height=lc.height=innerHeight;}
addEventListener('resize',resize);resize();

const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const clampInt=(v,a,b)=>clamp(Math.round(+v||0),a,b);
const f1=n=>(+n).toFixed(1);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=L=>Math.pow(1.3,L);
function fmt(n){n=Math.max(0,+n||0);if(n<1000)return n<10&&n%1?n.toFixed(1):String(Math.round(n));if(n>=1e33)return n.toExponential(2);const u=['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];let i=-1;while(n>=1000){n/=1000;i++;}return(n<10?n.toFixed(2):n<100?n.toFixed(1):Math.round(n))+u[i];}

/* ===================== データ定義 ===================== */
const RAR=['常','稀','秘','禁','奈落'],RCOL=['#b8b8b8','#5ab0ff','#c27bff','#ff9a2e','#ff3b5c'],RAR_EN=['Common','Rare','Arcane','Forbidden','Abyssal'];
const BUD=[8,12,18,24,32],CAP=[4,6,8,10,10];
const TRAITGEN=[1,1,2,2,3],TRAITCAP=[1,2,2,3,4];          // 生成時の特性数／合成で増やせる上限
const RUNEGEN=[[0,1],[1,1],[1,1],[1,2],[2,2]];   // 刻印の数
// 条件／発動の枠：常・稀は1/1、秘・禁（出現20%未満）はどちらか片方が2、奈落（1%）は2/2
// 希少度 q：この等級以上が出る確率に相当（小さいほど珍しい）。常1 > 稀0.45 > 秘0.17 > 禁0.05 > 奈落0.01 > …
const TIERP=[1,0.45,0.17,0.05,0.01,0];
// 条件＋発動の合計枠：常・稀は2、秘・禁は3、奈落は4。奈落の中でも確率が1/4になるごとに +1（上限なし、念のため12で止める）
function slotsFor(rar,q){if(rar<2)return 2;if(rar<4)return 3;return Math.min(12,4+Math.floor(Math.max(0,Math.log(0.01/Math.max(q,1e-12))/Math.log(4))));}
const qOf=r=>r.q??TIERP[r.rarity];
function RSHAPE(rar,q){const t=slotsFor(rar,q??TIERP[rar]),c=Math.random()<.5?Math.ceil(t/2):Math.floor(t/2);return[c,t-c];}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const condBonus=n=>1+0.35*(n-1);                                  // 条件が多いほど発動が強い
const SLOTS=['head','body','arms','legs','acc1','acc2','weapon'];
const SLOT_JA={head:'頭',body:'体',arms:'腕',legs:'足',acc1:'装飾',acc2:'装飾',accessory:'装飾',weapon:'武器'};
const STAT_JA={hp:'体力',atk:'攻撃',def:'防御',spd:'速さ',jmp:'跳躍',mine:'採掘',light:'灯り',regen:'再生',crit:'会心'};

// 特性：常に効く性質（移動・採掘・戦闘）
const TRAITS={
  double_jump:{ja:'空中跳躍',d:v=>`空中で${v}回跳べる`,max:3,en:'extra mid-air jumps (value 1-3)'},
  rocket:{ja:'噴射',d:v=>`空中で跳躍キー長押しで上昇（燃料${f1(0.6+v*0.25)}秒）`,en:'rocket boots: hold jump in mid-air to fly; value = fuel'},
  grapple:{ja:'鉤縄',d:v=>`F で鉤縄を射出（射程${Math.round((200+v*30)/TS)}マス）`,en:'grappling hook (F key); value = range and pull speed'},
  glide:{ja:'滑空',d:()=>'跳躍キー長押しでゆっくり落ちる',bool:1,en:'glide by holding jump'},
  wall_climb:{ja:'壁登り',d:()=>'壁に向かって押すと登れる',bool:1,en:'climb walls'},
  wall_jump:{ja:'壁蹴り',d:()=>'空中で壁際なら壁を蹴って跳べる',bool:1,en:'wall jump'},
  fall_immunity:{ja:'落下無効',d:()=>'落下ダメージを受けない',bool:1,en:'no fall damage'},
  mine_speed:{ja:'掘削加速',d:v=>`採掘速度 +${v*12}%`,en:'faster mining'},
  mine_reach:{ja:'長柄',d:v=>`採掘距離 +${f1(v*0.5)}マス`,en:'longer mining reach'},
  vein_mine:{ja:'鉱脈辿り',d:v=>`鉱脈を掘ると、繋がった鉱脈を最大${v*2}個まとめて掘る`,en:'mining ore also mines connected ore'},
  area_mine:{ja:'崩落',d:v=>`掘ると隣のブロックが${v*10}%で崩れる`,en:'mined blocks may collapse their neighbors'},
  satellite:{ja:'衛星',d:v=>`身体の周りを光球${Math.min(4,1+Math.floor(v/3))}個が巡り、敵を打ち、敵の弾を防ぐ`,en:'orbiting guardian orbs'},
  spelunker:{ja:'探掘眼',d:()=>'闇の中でも鉱脈と宝箱が見える',bool:1,en:'see ore and chests through darkness'},

// 0空気 1土 2硬岩 3外壁 4鉱脈 5宝箱 6光苔 7キャンプ
function gen(x,y){
  if(x<2||x>=W-2)return 3;
  if(y<TOP)return(y===TOP-1&&x===townX())?7:0;
  const m=(y-TOP)%LAYER;
  if(m===0&&y>TOP){const sx=Math.round(shaftX(y));if(Math.abs(x-sx)<=9)return 1;}
  if(m>=LAYER-6){const cr=y+(LAYER-m),sx=Math.round(shaftX(cr));if(Math.abs(x-sx)<=9)return(m===LAYER-1&&x===sx)?7:0;}
  const L=layerOf(y),dx=Math.abs(x-shaftX(y));

  else air=fbm(x*0.075,y*0.075,L*13+1)>0.585-Math.min(0.06,L*0.008);

  if(y>TOP+3&&(vn(x*0.23,y*0.23,333+L)>0.82-Math.min(0.05,L*0.004)||h2(x,y,3)<0.003))return 4; // 鉱脈は塊で出る

    if(k==='weapon'&&r.weapon)s.weapon=Object.assign({},r.weapon,{name:r.name,rar:r.rarity});
  }

}

    case'flare':pl.flareT=3+p*0.4;pl.flareR=80+p*12;fx.push({type:'ring',x:pcx,y:pcy,r:140,t:.3,max:.3,col:'#fff6c8'});for(const t of nearest(pcx,pcy,140,99))t.frozen=Math.max(t.frozen,0.6);break;
    case'fuel':pl.fuel=S.fuelMax;break;
  }
}

function glowP(x,y,cols,o={}){const sp=o.sp??80,a=rand(0,Math.PI*2),v=rand(0.2,1)*sp,life=o.life||.6;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(o.up||0),t:rand(.5,1)*life,t0:life,col:pick(cols),glow:true,g:o.g??-20,sz:o.sz||2});if(parts.length>700)parts.splice(0,parts.length-700);}
function wcols(w){const c=RPAL[w.rar||0].slice();if(w.element==='fire')c.push('#ff8a3c','#ffd27a');if(w.element==='ice')c.push('#9be8ff','#e6fbff');return c;}
function burst(x,y,col,n){for(let i=0;i<n;i++)parts.push({x,y,vx:rand(-120,120),vy:rand(-160,60),t:rand(.3,.7),col});if(parts.length>400)parts.splice(0,parts.length-400);}
function addNum(x,y,v,col){nums.push({x:x+rand(-6,6),y,txt:typeof v==='number'?fmt(v):v,t:.9,col});if(nums.length>60)nums.shift();}
const logs=[];
function log(t,c='#ddd'){logs.push({t,c,time:performance.now()});if(logs.length>7)logs.shift();renderLog();}

function heal(n){pl.hp=Math.min(S.maxHp,pl.hp+n);}
function hurt(dmg,src,ent,pos){
  if(dead)return;
  const raw=src==='curse'||src==='drain'||src==='fall';
  if(!raw){if(pl.inv>0||pl.dashT>0)return;dmg*=1-S.def/(S.def+20*P(layerOf(curRow())));pl.inv=0.6;if(ent&&S.thorns)hitEnemy(ent,dmg*S.thorns,{noCrit:true,rune:true});}
  dmg*=1+S.fragile;
  let broke=false;
  if(pl.shield>0&&src!=='drain'){const a=Math.min(pl.shield,dmg);pl.shield-=a;dmg-=a;if(pl.shield<=0.001){pl.shield=0;broke=true;}}
  pl.hp-=dmg;
  if(src!=='drain'&&dmg>0)addNum(pl.x+pl.w/2,pl.y-4,dmg,'#ff6b7a');
  if(src==='curse'){curseFx=0.7;sfx('curse');}else if(src==='fall'){hurtFx=0.3;sfx('fall');}else if(src!=='drain'){hurtFx=0.3;sfx('hurt');}
  if(pl.hp<=0){die(src);return;}
  if(broke)fire('shield_break',{});
  if(!raw)fire('hurt',ent?{x:ent.x+ent.w/2,y:ent.y+ent.h/2}:pos||{});
  if(pl.hp<S.maxHp*0.3&&!pl.lowFlag){pl.lowFlag=true;fire('lowhp',{});}
}
function hitEnemy(e,dmg,opt={}){
  if(e.dead)return;
  let crit=false;if(!opt.noCrit&&!opt.dot&&Math.random()<S.crit){dmg*=2;crit=true;}
  e.hp-=dmg;e.flash=0.08;if(!opt.dot)sfx('hitE');
  if(opt.kx){e.vx+=opt.kx;if(e.type===0)e.vy=Math.min(e.vy,-150);}
  addNum(e.x+e.w/2,e.y,dmg,opt.dot?'#ffb36b':crit?'#ffdd55':opt.rune?'#e2c4ff':'#fff');
  if(!opt.dot){
    if(S.lifesteal)heal(dmg*S.lifesteal);
    if(opt.elem==='fire'||Math.random()<S.burn){e.burn=3;e.burnDps=Math.max(e.burnDps,dmg*0.3);}
    if(opt.elem==='ice'||Math.random()<S.freeze)e.frozen=2;
  }
  const c={x:e.x+e.w/2,y:e.y+e.h/2};
  if(e.hp<=0)killEnemy(e);

  }else if(w.kind==='bolt'){
    projs.push({x:cx,y:cy,vx:ca*560,vy:sa*560,r:4+w.rar*0.4,dmg,from:'p',life:.45+w.range*.07,elem:el,pierce:0,hit:new Set(),col:w.rar>=1&&el==='none'?RCOL[w.rar]:col,rar:w.rar,wc:wcols(w)});
  }else if(w.kind==='beam'){

    fx.push({type:'line',x1:cx,y1:cy,x2:cx+ca*len,y2:cy+sa*len,t:.12,max:.12,col:w.rar>=1&&el==='none'?RCOL[w.rar]:col,lw:3+w.rar});
    if(w.rar>=2)for(let i=0;i<6+w.rar*5;i++){const t=Math.random()*len;glowP(cx+ca*t,cy+sa*t,wcols(w),{sp:40,up:10,life:.45});}
    fire('impact',{x:cx+ca*(len-4),y:cy+sa*(len-4)});
    for(const e of enemies){const px=e.x+e.w/2-cx,py=e.y+e.h/2-cy,tt=clamp(px*ca+py*sa,0,len);if(Math.hypot(px-ca*tt,py-sa*tt)<e.w/2+5)hitEnemy(e,dmg*0.9,{elem:el});}
  }else{
    const n=3+Math.floor(w.range/3);
    for(let i=0;i<n;i++){const aa=a+(i-(n-1)/2)*0.16;projs.push({x:cx,y:cy,vx:Math.cos(aa)*520,vy:Math.sin(aa)*520,r:3,dmg:dmg*0.5,from:'p',life:.35+w.range*.04,elem:el,pierce:0,hit:new Set(),col:w.rar>=1&&el==='none'?RCOL[w.rar]:col,rar:w.rar,wc:wcols(w)});}
  }

// 戻り値: 壊せたか。o.manual = プレイヤーの手掘り（刻印・連鎖採掘のきっかけになる）
function breakTile(x,y,o={}){
  const t=getTile(x,y);if(!BREAK[t])return false;setTile(x,y,0);
  const L=layerOf(y),pal=palette(L),px=(x+.5)*TS,py=(y+.5)*TS;
  if(t===4){const g=Math.round(2*P(L)*(1+S.ore));st.frag+=g;addNum(px,y*TS,'+'+fmt(g),'#9fd');burst(px,py,pal.ore,8);sfx('ore');}
  else if(t===5)openChest(x,y);
  else{sfx('brk');}if(t!==4&&t!==5)burst(px,py,t===2?pal.hard[0]:t===6?pal.fungus:pal.soft[0],5);
  if(o.manual){
    const c={x:px,y:py};
    if(t!==5&&t!==6)fire('dig',c);
    if(t===4){fire('ore',c);if(S.vein)veinMine(x,y,S.vein);}
    else if(S.area&&t!==5&&t!==6)for(const[dx,dy]of N4)if(Math.random()<S.area){const t2=getTile(x+dx,y+dy);if(t2===1||t2===2||t2===4)breakTile(x+dx,y+dy);}
  }
  return true;
}
function veinMine(x,y,max){
  const q=[[x,y]],seen=new Set([x+','+y]);let c=0;
  while(q.length&&c<max){const[cx,cy]=q.shift();for(const[dx,dy]of N8){const nx=cx+dx,ny=cy+dy,k=nx+','+ny;if(seen.has(k))continue;seen.add(k);if(getTile(nx,ny)===4){breakTile(nx,ny);c++;q.push([nx,ny]);if(c>=max)break;}}}
}
function openChest(x,y){sfx('chest');const cg=chestRoll(x,y),cr=cg.rar,L=layerOf(y);setTile(x,y,0);burst((x+.5)*TS,(y+.5)*TS,CHEST[cr][1],18);for(let i=0;i<cr*8;i++)glowP((x+.5)*TS,(y+.5)*TS,RPAL[cr],{sp:160,up:60,life:.8});spawnRelic(L,cr,'宝箱',cg.q);}
function blinkDown(n,quiet){
  const tx=Math.floor((pl.x+pl.w/2)/TS),row=curRow();

      burst(pl.x+pl.w/2,pl.y+pl.h/2,'#c9a2ff',16);return true;}
  }
  if(!quiet)log('転移先の空洞が見つからない','#aaa');return false;
}
function useAbility(i){
  const r=S.actives[i];if(!r||dead)return;
  const a=r.active,key='a'+r.id;if(cds[key])return;
  const pw=a.power,pcx=pl.x+pl.w/2,pcy=pl.y+pl.h/2,ang=Math.atan2(mouse.wy-pcy,mouse.wx-pcx),atk=S.atk;let ok=true;
  switch(a.type){
    case'dash':pl.dashT=0.18;pl.dashV=[Math.cos(ang)*950,Math.sin(ang)*750];pl.dashDmg=atk*(1+pw*0.35);hook.st=0;for(const e of enemies)e.dashHit=false;break;
    case'blast':{const R=70+pw*9;fx.push({type:'ring',x:pcx,y:pcy,r:R,t:.35,max:.35,col:'#ffd27a'});for(const e of enemies)if(Math.hypot(e.x+e.w/2-pcx,e.y+e.h/2-pcy)<R+e.w/2)hitEnemy(e,atk*(1.5+pw*0.45),{kx:Math.sign(e.x-pl.x)*300});break;}
    case'barrage':{const n=4+pw;for(let k=0;k<n;k++){const aa=ang+(k-(n-1)/2)*(1.1/n)+rand(-.05,.05);projs.push({x:pcx,y:pcy,vx:Math.cos(aa)*520,vy:Math.sin(aa)*520,r:3.5,dmg:atk*(0.45+pw*0.07),from:'p',life:.9,elem:'none',pierce:0,hit:new Set(),col:'#ffe08a'});}break;}
    case'shield':pl.shield=S.maxHp*(0.2+pw*0.05);pl.shieldT=6;break;
    case'heal':heal(S.maxHp*(0.2+pw*0.05));burst(pcx,pcy,'#8f8',20);break;
    case'blink_down':ok=blinkDown(8+pw*2);break;
    case'gravity_well':wells.push({x:mouse.wx,y:mouse.wy,t:3+pw*0.2,r:110+pw*10,dps:atk*(0.5+pw*0.15),tick:0});break;
    case'time_slow':slowT=3+pw*0.4;fx.push({type:'ring',x:pcx,y:pcy,r:400,t:.5,max:.5,col:'#9ad'});break;
    case'excavate':{const cx=Math.floor(mouse.wx/TS),cy=Math.floor(mouse.wy/TS),R=2+pw*0.35;for(let y=Math.floor(cy-R);y<=cy+R;y++)for(let x=Math.floor(cx-R);x<=cx+R;x++)if(Math.hypot(x-cx,y-cy)<=R)breakTile(x,y);fx.push({type:'ring',x:(cx+.5)*TS,y:(cy+.5)*TS,r:R*TS,t:.3,max:.3,col:'#d9b37a'});break;}
    case'summon_orb':pl.orbs={n:1+Math.floor(pw/3),t:15,dmg:atk*(0.5+pw*0.1),a:0};break;
  }
  if(ok){cds[key]=a.cd;sfx(a.type==='blast'?'boom':a.type==='blink_down'?'tele':a.type==='heal'?'heal':'ability');fire('ability',{});}

function fireHook(){

const disVal=r=>Math.round(5*P(r.L)*(1+r.rarity)*r.lvl);

/* ===================== 更新 ===================== */
function findCamp(){const cx=Math.floor((pl.x+pl.w/2)/TS),cy=Math.floor((pl.y+pl.h/2)/TS);for(let y=cy-3;y<=cy+3;y++)for(let x=cx-3;x<=cx+3;x++)if(getTile(x,y)===7)return{x,y};return null;}
function update(dt){
  const s=S;
  for(const k in cds){cds[k]-=dt;if(cds[k]<=0)delete cds[k];}
  pl.inv=Math.max(0,pl.inv-dt);pl.atkT-=dt;slowT=Math.max(0,slowT-dt);curseFx=Math.max(0,curseFx-dt);hurtFx=Math.max(0,hurtFx-dt);
  pl.hasteT-=dt;pl.mhT-=dt;pl.flareT-=dt;pl.ctrlLock-=dt;
  if(pl.shieldT>0){pl.shieldT-=dt;if(pl.shieldT<=0)pl.shield=0;}
  if(pl.lowFlag&&pl.hp>s.maxHp*0.5)pl.lowFlag=false;
  if(touch.on)touchUpdate();
  mouse.wx=mouse.x+cam.x;mouse.wy=mouse.y+cam.y;
  for(const R of s.runes){const r=rtOf(R);r.cd-=dt;R.ts.forEach((c,i)=>{if(c.t==='interval'){r.tm[i]+=dt;if(r.tm[i]>=c.n){r.tm[i]=0;r.c[i]=c.n-1;bump(R,i,{});}}});}
  if(dead)return;

  // 鉤縄
  const pcx0=pl.x+pl.w/2,pcy0=pl.y+pl.h/2;
  if(!s.hook)hook.st=0;
  if(hook.st===1){
    for(let i=0;i<4;i++){hook.x+=hook.vx*dt/4;hook.y+=hook.vy*dt/4;const tx=Math.floor(hook.x/TS),ty=Math.floor(hook.y/TS);
      if(SOLID(getTile(tx,ty))){sfx('hookH');hook.st=2;hook.tx=tx;hook.ty=ty;pl.jumps=s.dj;pl.fuel=s.fuelMax;fire('hook',{x:hook.x,y:hook.y});break;}}
    if(hook.st===1&&Math.hypot(hook.x-pcx0,hook.y-pcy0)>s.hookRange)hook.st=0;
  }
  if(hook.st===2&&!SOLID(getTile(hook.tx,hook.ty)))hook.st=0;

  // 移動
  const dir=((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0);
  const jumpHeld=keys.Space||keys.KeyW||keys.ArrowUp;
  if(pl.onGround){pl.coy=0.09;pl.airT=0;pl.fuel=s.fuelMax;}else{pl.coy-=dt;pl.airT+=dt;}
  if(!pl.onGround&&pl.hitWall){pl.wallT=0.14;pl.wallDir=pl.hitWall;}else pl.wallT-=dt;
  let rocketing=false;
  if(pl.dashT>0){
    pl.dashT-=dt;pl.vx=pl.dashV[0];pl.vy=pl.dashV[1];
    for(const e of enemies)if(!e.dashHit&&overlap(pl,e)){e.dashHit=true;hitEnemy(e,pl.dashDmg,{});fire('dash_hit',{x:e.x+e.w/2,y:e.y+e.h/2});}
    if(pl.dashT<=0){pl.vx*=0.3;pl.vy*=0.3;}
  }else if(hook.st===2){
    if(jumpQ){hook.st=0;pl.vy=-430*s.jmp;pl.jumps=s.dj;sfx('jump');fire('jump',{});}
    else{const dx=hook.x-pcx0,dy=hook.y-pcy0,d=Math.hypot(dx,dy);if(d>14){pl.vx=dx/d*s.hookSpd;pl.vy=dy/d*s.hookSpd;}else{pl.vx=0;pl.vy=0;}}
  }else{
    if(pl.ctrlLock<=0)pl.vx+=(dir*165*s.spd*(pl.hasteT>0?pl.hasteMul:1)-pl.vx)*Math.min(1,dt*(pl.onGround?16:7));
    if(dir)pl.face=dir;
    if(jumpQ){
      if(pl.coy>0){pl.vy=-430*s.jmp;pl.jumps=s.dj;pl.coy=0;sfx('jump');fire('jump',{});}
      else if(s.wallJump&&pl.wallT>0){pl.vy=-420*s.jmp;pl.vx=-pl.wallDir*330;pl.ctrlLock=0.18;pl.wallT=0;sfx('ajump');burst(pl.x+pl.w/2,pl.y+pl.h/2,'#dff',6);fire('jump',{});}
      else if(pl.jumps>0){pl.vy=-400*s.jmp;pl.jumps--;sfx('ajump');burst(pl.x+pl.w/2,pl.y+pl.h,'#dff',6);fire('jump',{});}
    }
    pl.vy+=1400*dt;
    if(s.fuelMax>0&&jumpHeld&&!pl.onGround&&pl.jumps<=0&&pl.fuel>0&&pl.airT>0.12&&!jumpQ){
      rocketing=true;pl.vy=Math.max(pl.vy-2900*dt,-320);pl.fuel-=dt;sfx('rocket');
      if(Math.random()<.7)parts.push({x:pl.x+pl.w/2+rand(-3,3),y:pl.y+pl.h,vx:rand(-30,30),vy:rand(80,200),t:rand(.15,.35),col:pick(['#ffb347','#ff6a3c','#ffe08a'])});
    }
    if(s.glide&&jumpHeld&&!rocketing&&pl.vy>110)pl.vy=110;
    if(s.climb&&!pl.onGround&&dir&&pl.hitWall===dir)pl.vy=Math.min(pl.vy,-140);
    pl.vy=Math.min(pl.vy,950);
  }
  jumpQ=false;
  const vyB=pl.vy,wasG=pl.onGround;
  moveEnt(pl,dt,pl.dashT<=0&&hook.st!==2);
  if(pl.onGround&&!wasG&&pl.dashT<=0){
    if(vyB>700&&!s.fallImm){hurt(s.maxHp*0.3*(vyB-700)/250,'fall');log('落下の衝撃','#f99');}
    if(vyB>500)fire('land',{x:pl.x+pl.w/2,y:pl.y+pl.h});
  }
  pl.walk+=Math.abs(pl.vx)*dt*0.09;

  // 採掘・攻撃
  const pcx=pl.x+pl.w/2,pcy=pl.y+pl.h/2;
  let tx=Math.floor(mouse.wx/TS),ty=Math.floor(mouse.wy/TS),wantMine=mouse.l;
  if(touch.on){wantMine=false;if(touch.mag>0.5){const t=touchMineTarget();if(t){tx=t[0];ty=t[1];wantMine=true;}}}
  const tt=getTile(tx,ty);
  const inRange=Math.hypot((tx+.5)*TS-pcx,(ty+.5)*TS-pcy)<=(5.5+s.reach)*TS,mineable=BREAK[tt]>0;
  hover={tx,ty,ok:inRange&&mineable};
  if(wantMine&&hover.ok){
    if(!mineT||mineT.x!==tx||mineT.y!==ty)mineT={x:tx,y:ty,p:0};
    sfx('dig');
    mineT.p+=5*s.mine*s.mineMul*(pl.mhT>0?pl.mhMul:1)/(BREAK[tt]*Math.pow(P(layerOf(ty)),0.9))*dt;
    if(mineT.p>=1){breakTile(tx,ty,{manual:true});mineT=null;}
  }else{mineT=null;if(mouse.l)attack();}
  if(mouse.r)attack();

  // 宝箱・キャンプ
  {const x0=Math.floor(pl.x/TS),x1=Math.floor((pl.x+pl.w)/TS),y0=Math.floor(pl.y/TS),y1=Math.floor((pl.y+pl.h)/TS);
   for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(getTile(x,y)===5)openChest(x,y);}
  campNear=findCamp();
  if(campNear){const rx=campNear.x*TS+3,ry=(campNear.y+1)*TS-pl.h-0.1;if(st.respawn.x!==rx||st.respawn.y!==ry){st.respawn={x:rx,y:ry};log('キャンプを見つけた。ここから再開できる（E で休息、I で合成炉）','#ffcf6b');sfx('camp');save();}}

  // 浮上の代償・層・潜行
  const row=curRow(),L=layerOf(row);
  if(row>pl.deepRow)pl.deepRow=row;
  if(row>TOP+10&&row<pl.deepRow-12){
    const n=(pl.deepRow-12)-row;
    hurt(s.maxHp*(0.02+0.006*Math.min(L,30))*n*(1-s.curseRes)*(1+s.curseWeak),'curse');
    pl.deepRow=row+12;if(Math.random()<0.25)log(pick(CURSE_MSG),'#c9f');
    fire('ascend',{});
  }
  if(row>=pl.descMark+10){pl.descMark+=10;fire('descend',{});}
  if(L>st.maxLayer){st.maxLayer=L;ensureLayer(L);showBanner(L);}
  ensureLayer(L);
  const d=Math.max(0,row-TOP);if(d>st.best)st.best=d;
  if(s.drain)hurt(s.maxHp*s.drain*dt,'drain');
  if(!dead)heal(s.regen*dt);

  // 敵
  spawnT-=dt;
  if(spawnT<=0){spawnT=rand(1.2,2.6);if(row>TOP+15&&enemies.length<Math.min(16,5+Math.floor(L*0.6))&&!campNear)trySpawn();}
  for(const e of enemies){
    const k=(slowT>0?0.3:1)*(e.frozen>0?0.45:1);
    e.flash-=dt;e.frozen-=dt;e.oc-=dt;e.ph+=dt*k;
    if(e.burn>0){e.burn-=dt;e.bt-=dt;if(e.bt<=0){e.bt=0.5;hitEnemy(e,e.burnDps*0.5,{dot:true});}}
    if(e.dead)continue;
    const ex=e.x+e.w/2,ey=e.y+e.h/2,dx=pcx-ex,dy=pcy-ey,dist=Math.hypot(dx,dy)||1;
    if(e.type===0){
      if(dist<520)e.vx+=(Math.sign(dx)*e.spd*k-e.vx)*Math.min(1,dt*5);else e.vx*=0.9;
      e.vy=Math.min(e.vy+1400*dt,900);moveEnt(e,dt,true);
      if(e.hitWall&&e.onGround)e.vy=-420;else if(e.onGround&&dy<-40&&Math.abs(dx)<70&&Math.random()<dt*2)e.vy=-480;
    }else if(e.type===1){
      if(dist<650){e.vx+=(dx/dist*e.spd*k*1.2-e.vx)*dt*2.5;e.vy+=(dy/dist*e.spd*k*1.2-e.vy)*dt*2.5;}
      e.x+=e.vx*dt;e.y+=e.vy*dt+Math.sin(e.ph*5)*0.4;
    }else{
      const tx2=pcx-dx/dist*190,ty2=pcy-dy/dist*190-40;
      e.vx+=((tx2-ex)*0.9-e.vx)*dt*1.5;e.vy+=((ty2-ey)*0.9-e.vy)*dt*1.5;
      const sp=Math.hypot(e.vx,e.vy),mx=e.spd*k;if(sp>mx){e.vx*=mx/sp;e.vy*=mx/sp;}
      e.x+=e.vx*dt;e.y+=e.vy*dt;e.st-=dt*k;
      if(e.st<=0&&dist<480){e.st=e.elite?1.2:2.2;sfx('eshot');const n=e.elite?3:1;for(let i=0;i<n;i++){const aa=Math.atan2(dy,dx)+(i-(n-1)/2)*0.25;projs.push({x:ex,y:ey,vx:Math.cos(aa)*250,vy:Math.sin(aa)*250,r:4,dmg:e.dmg,from:'e',life:3,col:'#ff6fae'});}}
    }
    if(overlap(pl,e))hurt(e.dmg,'hit',e);
    if(dist>1200)e.dead=true;
  }
  enemies=enemies.filter(e=>!e.dead);

  for(const w of wells){
    w.t-=dt;w.tick-=dt;const tick=w.tick<=0;if(tick)w.tick=0.25;
    for(const e of enemies){const dx=w.x-(e.x+e.w/2),dy=w.y-(e.y+e.h/2),dd=Math.hypot(dx,dy)||1;if(dd<w.r){if(e.type!==0){e.x+=dx/dd*150*dt;e.y+=dy/dd*150*dt;}else e.vx+=dx/dd*600*dt;if(tick)hitEnemy(e,w.dps*0.25,{dot:true});}}
  }
  wells=wells.filter(w=>w.t>0);
  if(pl.orbs){
    const o=pl.orbs;o.t-=dt;o.a+=dt*3.2;
    for(let i=0;i<o.n;i++){const ox=pcx+Math.cos(o.a+i*Math.PI*2/o.n)*42,oy=pcy+Math.sin(o.a+i*Math.PI*2/o.n)*42;
      for(const e of enemies)if(e.oc<=0&&Math.hypot(e.x+e.w/2-ox,e.y+e.h/2-oy)<e.w/2+8){e.oc=0.4;hitEnemy(e,o.dmg,{rune:true});}}
    if(o.t<=0)pl.orbs=null;
  }
  // 衛星（常に周回して敵を打ち、敵の弾を消す）
  if(s.sat){
    const n=Math.min(4,1+Math.floor(s.sat/3)),R=30+n*3,dmg=s.atk*(0.3+s.sat*0.08),pal=RPAL[Math.max(1,s.satRar)];
    pl.satA=(pl.satA||0)+dt*(2.2+s.sat*0.08);pl.satPos=[];
    for(let i=0;i<n;i++){
      const a=pl.satA+i*Math.PI*2/n,ox=pcx+Math.cos(a)*R,oy=pcy+Math.sin(a)*R*0.85;pl.satPos.push([ox,oy]);
      for(const e of enemies)if(e.oc<=0&&Math.hypot(e.x+e.w/2-ox,e.y+e.h/2-oy)<e.w/2+7){e.oc=0.45;hitEnemy(e,dmg,{rune:true,noCrit:true,kx:Math.sign(e.x-pl.x)*120});}
      for(const p of projs)if(p.from==='e'&&p.life>0&&Math.hypot(p.x-ox,p.y-oy)<10){p.life=0;for(let k=0;k<6;k++)glowP(ox,oy,pal,{sp:90,life:.3});sfx('hookH');}
      if(Math.random()<.35)glowP(ox,oy,pal,{sp:8,life:.35,g:0,sz:1.5});
    }
  }else pl.satPos=null;
  // 高レア武器のオーラ
  {const w=s.weapon;if(w.rar>=3&&Math.random()<(w.rar-2)*0.3){const a=Math.atan2(mouse.wy-(pl.y+11),mouse.wx-(pl.x+5));glowP(pl.x+5+Math.cos(a)*16,pl.y+11+Math.sin(a)*16,wcols(w),{sp:15,up:30,life:.6});}
   if(w.rar>=4&&Math.random()<.3)glowP(pl.x+rand(0,pl.w),pl.y+rand(0,pl.h),['#ff3b5c','#ff7a3c'],{sp:10,up:40,life:.8});}
  enemies=enemies.filter(e=>!e.dead);

  for(const p of projs){
    if(p.tg&&!p.tg.dead){const sp=Math.hypot(p.vx,p.vy),dx=p.tg.x+p.tg.w/2-p.x,dy=p.tg.y+p.tg.h/2-p.y,d=Math.hypot(dx,dy)||1;p.vx+=(dx/d*sp-p.vx)*Math.min(1,dt*6);p.vy+=(dy/d*sp-p.vy)*Math.min(1,dt*6);}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.rar>=2&&Math.random()<0.25+p.rar*0.15)glowP(p.x,p.y,p.wc||RPAL[p.rar],{sp:25,up:5,life:.35,sz:1.5+p.rar*0.3});
    if(SOLID(getTile(Math.floor(p.x/TS),Math.floor(p.y/TS)))){p.life=0;if(p.from==='p'&&!p.rune)fire('impact',{x:p.x-p.vx*0.02,y:p.y-p.vy*0.02});continue;}
    if(p.from==='p'){for(const e of enemies){if(e.dead||p.hit.has(e))continue;if(p.x>e.x-p.r&&p.x<e.x+e.w+p.r&&p.y>e.y-p.r&&p.y<e.y+e.h+p.r){hitEnemy(e,p.dmg,{elem:p.elem,rune:p.rune});p.hit.add(e);if(!p.rune)fire('impact',{x:p.x,y:p.y});if(p.pierce--<=0){p.life=0;break;}}}}
    else if(p.x>pl.x-p.r&&p.x<pl.x+pl.w+p.r&&p.y>pl.y-p.r&&p.y<pl.y+pl.h+p.r){hurt(p.dmg,'proj',null,{x:p.x-p.vx*0.05,y:p.y-p.vy*0.05});p.life=0;}
  }
  projs=projs.filter(p=>p.life>0);
  enemies=enemies.filter(e=>!e.dead);

  for(const f of fx)f.t-=dt;fx=fx.filter(f=>f.t>0);
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=(q.g??500)*dt;if(q.glow){q.vx*=0.97;q.vy*=0.97;}q.t-=dt;}parts=parts.filter(q=>q.t>0);
  for(const n of nums){n.y-=32*dt;n.t-=dt;}nums=nums.filter(n=>n.t>0);

  const tcx=W*TS<VW?(W*TS-VW)/2:clamp(pl.x+pl.w/2-VW/2,0,W*TS-VW),tcy=pl.y+pl.h/2-VH*0.45;
  cam.x+=(tcx-cam.x)*Math.min(1,dt*8);cam.y+=(tcy-cam.y)*Math.min(1,dt*8);
  saveT+=dt;if(saveT>15){saveT=0;save();}
}

/* ===================== 描画 ===================== */
function drawHouses(){
  const gy=TOP*TS-cam.y,sx=shaftX(TOP);
  for(let i=4;i<W-8;i+=7){
    if(h2(i,0,42)>0.6||Math.abs(i+2-sx)<16||Math.abs(i+2-townX())<4)continue;
    const hh=(3+Math.floor(h2(i,1,42)*3))*TS,ww=5*TS,x=i*TS-cam.x;
    ctx.fillStyle='#2a2230';ctx.fillRect(x,gy-hh,ww,hh);
    ctx.fillStyle='#1d1722';ctx.beginPath();ctx.moveTo(x-6,gy-hh);ctx.lineTo(x+ww/2,gy-hh-20);ctx.lineTo(x+ww+6,gy-hh);ctx.fill();
    ctx.fillStyle='#ffcf7a';for(let w=0;w<2;w++)if(h2(i,w+3,42)<0.7)ctx.fillRect(x+12+w*36,gy-hh+16,10,10);
  }
}
function drawPlayer(){
  if(pl.inv>0&&!dead&&Math.floor(pl.inv*20)%2)return;
  const x=Math.round(pl.x-cam.x),y=Math.round(pl.y-cam.y);
  const rc=k=>{const r=byId(st.equip[k]);return r?RCOL[r.rarity]:null;};

  ctx.fillStyle=rc('legs')||'#3b3a4a';ctx.fillRect(x+1,y+16,3,6+lo*0.4);ctx.fillRect(x+6,y+16,3,6-lo*0.4);
  ctx.fillStyle='#2e2a24';ctx.fillRect(pl.face>0?x-3:x+10,y+9,3,8);
  ctx.fillStyle=rc('body')||'#5a4b3a';ctx.fillRect(x,y+8,10,9);
  const cx=x+5,cy=y+11,a=Math.atan2(mouse.wy-(pl.y+11),mouse.wx-(pl.x+5));
  ctx.strokeStyle=rc('arms')||'#c9a988';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*8,cy+Math.sin(a)*8);ctx.stroke();
  ctx.strokeStyle=RCOL[S.weapon.rar]||'#999';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*7,cy+Math.sin(a)*7);ctx.lineTo(cx+Math.cos(a)*16,cy+Math.sin(a)*16);ctx.stroke();ctx.lineWidth=1;
  ctx.fillStyle='#f1d3b3';ctx.fillRect(x+1,y+1,8,7);

  ctx.fillStyle='#222';ctx.fillRect(pl.face>0?x+6:x+2,y+4,2,2);

  if(pl.shield>0){ctx.strokeStyle='rgba(130,210,255,.75)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+5,y+11,18,0,7);ctx.stroke();ctx.lineWidth=1;}
}
function drawEnemy(e){
  const x=e.x-cam.x,y=e.y-cam.y,col=e.flash>0?'#fff':palette(e.L).enemy;
  ctx.fillStyle=col;ctx.strokeStyle=col;
  if(e.type===0){
    for(let i=0;i<3;i++){const lx2=x+3+i*(e.w-6)/2;ctx.beginPath();ctx.moveTo(lx2,y+e.h*0.6);ctx.lineTo(lx2+Math.sin(e.ph*12+i)*3,y+e.h);ctx.stroke();}
    ctx.beginPath();ctx.ellipse(x+e.w/2,y+e.h*0.5,e.w/2,e.h*0.4,0,0,7);ctx.fill();
    ctx.fillStyle='#ffef6b';ctx.fillRect(e.vx>=0?x+e.w-6:x+3,y+e.h*0.35,3,3);
  }else if(e.type===1){
    const f=Math.sin(e.ph*14)*e.h*0.6;
    ctx.beginPath();ctx.moveTo(x+e.w/2,y+e.h*0.4);ctx.lineTo(x-5,y+e.h/2-f);ctx.lineTo(x+e.w/2,y+e.h);ctx.lineTo(x+e.w+5,y+e.h/2-f);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(x+e.w/2-1,y+e.h*0.5,3,3);
  }else{
    ctx.beginPath();ctx.arc(x+e.w/2,y+e.h/2,e.w/2,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+e.w/2,y+e.h/2,e.w*0.28,0,7);ctx.fill();
    const a=Math.atan2(pl.y-e.y,pl.x-e.x);ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x+e.w/2+Math.cos(a)*2.5,y+e.h/2+Math.sin(a)*2.5,e.w*0.13,0,7);ctx.fill();
  }
  if(e.frozen>0){ctx.fillStyle='rgba(150,220,255,.4)';ctx.fillRect(x,y,e.w,e.h);}
  if(e.burn>0){ctx.fillStyle='#ff8a3c';ctx.fillRect(x+rand(0,e.w),y+rand(0,e.h*.5),2,2);}
  if(e.elite){ctx.strokeStyle='#ffcf4a';ctx.lineWidth=2;ctx.strokeRect(x-3,y-3,e.w+6,e.h+6);ctx.lineWidth=1;}
  if(e.hp<e.maxHp){ctx.fillStyle='#000';ctx.fillRect(x,y-6,e.w,3);ctx.fillStyle='#ff5a6e';ctx.fillRect(x,y-6,e.w*clamp(e.hp/e.maxHp,0,1),3);}
  if(e.elite||Math.hypot(mouse.wx-(e.x+e.w/2),mouse.wy-(e.y+e.h/2))<40){
    const info=st.layers[e.L],nm=(info&&info.creatures&&info.creatures[e.type]&&info.creatures[e.type].name)||'原生生物';
    ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillStyle=e.elite?'#ffcf4a':'#ddd';ctx.fillText((e.elite?'★ ':'')+nm,x+e.w/2,y-10);
  }
}

        case 3:ctx.fillStyle=pal.wall;ctx.fillRect(px,py,TS,TS);break;
        case 4:ctx.fillStyle=pal.soft[v];ctx.fillRect(px,py,TS,TS);ctx.fillStyle=pal.ore;ctx.fillRect(px+3,py+3,4,4);ctx.fillRect(px+9,py+7,4,4);ctx.fillRect(px+5,py+11,3,3);if(lights.length<90)lights.push([px+8,py+8,22]);if(S.spelunker)spel.push([px,py,pal.ore]);break;

          if(cr>=2){const pu=0.5+0.5*Math.sin(performance.now()/(cr>=4?160:280)+x);ctx.globalAlpha=0.3+pu*0.5;ctx.strokeStyle=C[1];ctx.lineWidth=1.5;ctx.strokeRect(px+1,py+4,14,13);ctx.globalAlpha=1;ctx.lineWidth=1;
            if(!paused&&Math.random()<0.05*cr)glowP((x+.5)*TS+rand(-6,6),(y+.6)*TS,RPAL[cr],{sp:12,up:35,life:.9});}
          lights.push([px+8,py+10,40+cr*18]);if(S.spelunker)spel.push([px,py,RCOL[cr]]);break;}
        case 6:ctx.fillStyle=pal.fungus;ctx.fillRect(px+7,py,2,8);ctx.beginPath();ctx.arc(px+8,py+9,4,0,7);ctx.fill();if(lights.length<90)lights.push([px+8,py+9,46]);break;
        case 7:ctx.fillStyle='#bbb';ctx.fillRect(px+3,py-16,2,32);ctx.fillStyle='#e8455a';ctx.beginPath();ctx.moveTo(px+5,py-16);ctx.lineTo(px+17,py-11);ctx.lineTo(px+5,py-6);ctx.fill();
          ctx.fillStyle='#ff9a3c';ctx.beginPath();ctx.arc(px+12,py+13,3+Math.sin(performance.now()/90),0,7);ctx.fill();lights.unshift([px+8,py+8,160]);break;
      }
    }
  }
  if(mineT){const px=mineT.x*TS-cx,py=mineT.y*TS-cy;ctx.strokeStyle=`rgba(0,0,0,${0.3+mineT.p*0.6})`;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px+3,py+3);ctx.lineTo(px+8,py+8);ctx.lineTo(px+5,py+13);ctx.moveTo(px+8,py+8);ctx.lineTo(px+13,py+5);ctx.stroke();ctx.lineWidth=1;}
  if(hover&&hover.ok){ctx.strokeStyle='rgba(255,255,255,.5)';ctx.strokeRect(hover.tx*TS-cx+.5,hover.ty*TS-cy+.5,TS-1,TS-1);}

    for(let k=0;then.length<ne&&k<40;k++){const e=pick(pref.length&&Math.random()<.8?pref:pool);if(!then.some(y=>y.effect===e)&&(!usedE.has(e)||k>20))then.push({effect:e,power:randi(1,cap),at:pick(['event','event','self','cursor','enemy'])});}
    then.forEach(x=>usedE.add(x.effect));

  }
  g.o.runes=runes;
  g.o.traits=shuffle(A.traits.concat(B.traits).map(t=>({type:t.type,value:t.v}))).concat(g.o.traits);
  if(slot==='weapon'){const ws=[A,B].filter(x=>x.weapon);if(ws.length){const w=pick(ws).weapon;g.o.weapon.kind=w.kind;if(Math.random()<.7)g.o.weapon.element=w.element;}}
  const acts=[A,B].filter(x=>x.active);if(acts.length&&Math.random()<.7){const a=pick(acts).active;g.o.active={type:a.type,name:a.name,cooldown:a.cd,power:clamp(a.power+randi(-1,1),1,cap)};}
  const r=normRelic(g.o,L,rar,slot),th=Math.random()<.5?thA:thB;

}
const anvInfo=()=>{const A=byId(anv.a),B=byId(anv.b);if(!A||!B||A.slot!==B.slot)return null;return{A,B,L:Math.max(A.L,B.L),rar:Math.max(A.rarity,B.rarity)};};
const rerollCost=()=>{const i=anvInfo();return i?Math.round(8*P(i.L)*(1+i.rar)*Math.pow(1.35,anv.k)):0;};
const takeCost=()=>{const i=anvInfo();return i?Math.round(12*P(i.L)*(1+i.rar*0.6)):0;};
function anvSet(){anv.out=null;anv.k=0;const i=anvInfo();if(i)anv.out=forge(i.A,i.B);}
function anvReroll(){const i=anvInfo();if(!i)return;if(!campNear){craftMsg='合成炉はキャンプで使える';return;}const c=rerollCost();if(st.frag<c){craftMsg='欠片が足りない';return;}
  st.frag-=c;anv.k++;anv.out=forge(i.A,i.B);sfx('craft');}
function anvTake(){
  const i=anvInfo(),r=anv.out;if(!i||!r)return;if(!campNear){craftMsg='合成炉はキャンプで使える';return;}
  const c=takeCost();if(st.frag<c){craftMsg='欠片が足りない';return;}
  st.frag-=c;const reEq=(isEq(i.A)&&i.A.slot===r.slot)||(isEq(i.B)&&i.B.slot===r.slot);
  unequip(i.A);unequip(i.B);st.inv=st.inv.filter(x=>x!==i.A&&x!==i.B);st.inv.push(r);st.names.push(r.name);if(st.names.length>20)st.names.shift();
  if(reEq)equip(r);recalc();
  log(`合成炉から【${RAR[r.rarity]}】${r.name} を取り出した`,RCOL[r.rarity]);sfx('relic',r.rarity);
  for(let k=0;k<20+r.rarity*10;k++)glowP(pl.x+pl.w/2,pl.y+pl.h/2,RPAL[r.rarity],{sp:200,up:40,life:1});
  anv.a=anv.b=null;anv.out=null;anv.k=0;selId=r.id;

function runeChips(u){return`<div class="chips">${u.ts.map(c=>`<span class="chip t">${esc(TRIG[c.t].ja(c.n))}</span>`).join('<span class="arrow">＋</span>')}<span class="arrow">→</span>${u.es.map(x=>`<span class="chip e">${esc(locText(x.e,x.at)+EFF[x.e].ja)} ${x.p}</span>`).join('')}</div>`;}
function craftTab(){
  if(anv.a&&!byId(anv.a))anv.a=null;if(anv.b&&!byId(anv.b))anv.b=null;if(!anvInfo())anv.out=null;
  const A=byId(anv.a),B=byId(anv.b),O=anv.out;
  const slotHtml=(r,k,ph,lab)=>`<div class="acol"><div class="aslot ${r?'':'empty'}" data-anv="${k}" ${r?`data-tid="${r.id}" style="border-color:${RCOL[r.rarity]}"`:''}>${r?relicIcon(r,46):svgIcon(ph,'#2c2c46',null,46)}${r&&isEq(r)?'<span class="b eq">E</span>':''}</div><div class="alab">${lab}</div></div>`;
  const outHtml=`<div class="acol"><div class="aslot out ${O?'':'empty'}" ${O?`data-tid="out" style="border-color:${RCOL[O.rarity]};box-shadow:0 0 18px ${RCOL[O.rarity]}66,inset 0 0 0 2px #000"`:''}>${O?relicIcon(O,50):'<span style="font-size:30px;color:#333">?</span>'}</div><div class="alab">${O?`<span style="color:${RCOL[O.rarity]}">【${RAR[O.rarity]}】${esc(O.name)}</span>`:'完成品'}</div></div>`;
  const camp=!!campNear,rc=rerollCost(),tc=takeCost();
  let html=`<div class="anvwrap"><div class="anvil">${slotHtml(A,'a','accessory','条件をもらう')}<div class="plus">＋</div>${slotHtml(B,'b','melee','発動をもらう')}<div class="arr">➜</div>${outHtml}</div>`;
  if(O)html+=`<div class="outrunes">${O.runes.map(runeChips).join('')}</div>`;
  html+=`<div class="abtns"><button data-act="reroll" ${O&&camp&&st.frag>=rc?'':'disabled'}>🎲 リロール<span class="cost">◆${fmt(rc)}</span></button><button class="pri" data-act="take" ${O&&camp&&st.frag>=tc?'':'disabled'}>取り出す<span class="cost">◆${fmt(tc)}</span></button></div>`;
  html+=`<div class="ahint">${!camp?'<span class="ng">キャンプでのみ使える</span>　':''}${craftMsg?`<span class="ng">${esc(craftMsg)}</span>　`:''}同じ部位どうしで合成 ・ 等級は高い方を受け継ぐ ・ 2つの遺物は消える ・ ◆ は欠片</div>`;
  const pin=A||B;
  const cells=[...st.inv].reverse().map(r=>{const used=r.id===anv.a||r.id===anv.b||(pin&&r.slot!==pin.slot);return cell(r).replace('class="cell','class="cell'+(used?' used':'')).replace('<div ','<div draggable="true" ');}).join('');
  html+=`<div class="grid agrid">${cells||'<div class="sum">遺物がない</div>'}</div></div>`;
  return html;
}
function renderInv(){

  $('invCard').innerHTML=`<div class="invh"><h2>遺物</h2><span>欠片 ${fmt(st.frag)} ・ 所持 ${st.inv.length}</span><button data-act="close">閉じる（I）</button></div>${tabs}${invTab==='relic'?relicTab():craftTab()}`;

$('invCard').addEventListener('click',e=>{
  sfx('ui');

    if(act==='close')return closeInv();
    if(act==='tab'){invTab=b.dataset.tab;renderInv();return;}
    if(act==='filt'){invFilter=b.dataset.f;renderInv();return;}
    if(act==='reroll'){anvReroll();save();renderInv();return;}
    if(act==='take'){anvTake();save();renderInv();return;}
    const r=byId(selId);if(!r)return;
    if(act==='rename'){renameRelic(r);return;}
    if(act==='eq')equip(r);else if(act==='un')unequip(r);
    else if(act==='up'){const c=upCost(r);if(st.frag>=c){st.frag-=c;r.lvl++;recalc();sfx('craft');}}
    else if(act==='dis'&&!isEq(r)){st.frag+=disVal(r);st.inv=st.inv.filter(x=>x!==r);if(anv.a===r.id||anv.b===r.id){anv.a=anv.a===r.id?null:anv.a;anv.b=anv.b===r.id?null:anv.b;anvSet();}selId=null;log(`「${r.name}」を分解して欠片 ${fmt(disVal(r))} を得た`,'#aaa');}
    save();renderInv();return;}
  const sl=e.target.closest('[data-anv]');

      const other=byId(anv.a===id||anv.b===id?null:(anv.a||anv.b)),me=byId(id);
      if(anv.a!==id&&anv.b!==id&&other&&me&&other.slot!==me.slot){craftMsg=`同じ部位（${SLOT_JA[other.slot]}）どうしでしか合成できない`;renderInv();return;}
      if(anv.a===id)anv.a=null;else if(anv.b===id)anv.b=null;else if(!anv.a)anv.a=id;else if(!anv.b)anv.b=id;else anv.b=id;
      anvSet();renderInv();return;}
    const n=performance.now();
    if(lastClick.id===id&&n-lastClick.t<380){const r=byId(id);if(r){isEq(r)?unequip(r):equip(r);sfx('craft');save();}lastClick={id:null,t:0};}
    else lastClick={id,t:n};
    selId=id;renderInv();return;}
  if(it&&it.dataset.slot){const k=it.dataset.slot;invFilter=k==='acc1'||k==='acc2'?'accessory':k;renderInv();}
});

/* ===================== スマホ操作 ===================== */
const touch={on:false,id:null,ox:0,oy:0,dx:0,dy:0,mag:0,atk:false};
function enableTouch(){

  $('touchNote').style.display='block';$('fsBtn').style.display='';layoutTouch();renderTouchAbil();

function layoutTouch(){
  const R=14,B=14,sr='env(safe-area-inset-right)',sb='env(safe-area-inset-bottom)';

// スティックを倒した方向の先にある、壊せるブロック（足元・頭の高さ・端も見る）
function touchMineTarget(){
  const ux=touch.dx/touch.mag,uy=touch.dy/touch.mag,reach=(1.7+S.reach*0.5)*TS;
  let org;
  if(Math.abs(uy)<0.45)org=[[pl.x+pl.w/2,pl.y+pl.h-5],[pl.x+pl.w/2,pl.y+5]];
  else if(uy>0)org=Math.abs(ux)<0.4?[[pl.x+pl.w/2,pl.y+pl.h-2],[pl.x+1,pl.y+pl.h-2],[pl.x+pl.w-1,pl.y+pl.h-2]]:[[pl.x+pl.w/2,pl.y+pl.h-2]];
  else org=Math.abs(ux)<0.4?[[pl.x+pl.w/2,pl.y+2],[pl.x+1,pl.y+2],[pl.x+pl.w-1,pl.y+2]]:[[pl.x+pl.w/2,pl.y+2]];
  for(const[ox,oy]of org)for(let d=2;d<=reach;d+=3){const tx=Math.floor((ox+ux*d)/TS),ty=Math.floor((oy+uy*d)/TS),t=getTile(tx,ty);if(BREAK[t])return[tx,ty];if(SOLID(t))break;}
  return null;
}
// 毎フレーム：スティックを移動キーに、近くの敵（いなければ倒した方向）を仮想カーソルに
function touchUpdate(){
  const pcx=pl.x+pl.w/2,pcy=pl.y+pl.h/2,m=touch.mag,ux=m>0.01?touch.dx/m:0,uy=m>0.01?touch.dy/m:0;
  const digDown=m>0.5&&uy>0.75,digUp=m>0.5&&uy<-0.8;
  keys.KeyA=m>0.3&&ux<-0.38&&!digDown&&!digUp;keys.KeyD=m>0.3&&ux>0.38&&!digDown&&!digUp;
  let tx,ty;const e=nearest(pcx,pcy,340,1)[0];
  if(e){tx=e.x+e.w/2;ty=e.y+e.h/2;}else if(m>0.3){tx=pcx+ux*120;ty=pcy+uy*120;}else{tx=pcx+pl.face*120;ty=pcy-10;}
  mouse.x=tx-cam.x;mouse.y=ty-cam.y;mouse.l=false;mouse.r=touch.atk;

function bindHold(id,down,up){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();try{el.setPointerCapture(e.pointerId);}catch(_){}el.classList.add('on');down&&down();});

{
